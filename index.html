<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos - Modern Age Calculator</title>

  <!-- Web Application Manifest (PWA) dynamically created via Blob -->
  <link id="manifest-placeholder" rel="manifest">

  <!-- Inter / Plus Jakarta Sans Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset & Core Design Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at 80% 20%, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px;
    }

    /* Ambient Glowing Background Orbs */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 380px;
      height: 380px;
      background: rgba(129, 140, 248, 0.22);
      top: 10%;
      left: 12%;
    }

    body::after {
      width: 320px;
      height: 320px;
      background: rgba(236, 72, 153, 0.18);
      bottom: 10%;
      right: 12%;
    }

    /* Glassmorphism Outer Card */
    .calculator-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 36px 30px;
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Brand Header */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: #c084fc;
      background: rgba(192, 132, 252, 0.12);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(192, 132, 252, 0.25);
    }

    .app-title {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* Input Controls */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .today-btn {
      background: transparent;
      border: none;
      color: #818cf8;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .today-btn:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    .custom-date-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-date-trigger:hover {
      border-color: #818cf8;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    .custom-date-trigger i {
      color: #818cf8;
      font-size: 1.1rem;
    }

    /* Primary Calculate Button */
    .calc-btn {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .calc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    .calc-btn:active {
      transform: translateY(0);
    }

    /* Error Banner */
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 0.85rem;
      padding: 12px;
      border-radius: 14px;
      margin-top: 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Results Section */
    .results-container {
      margin-top: 26px;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .date-summary {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 500;
    }

    .results-grid {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .result-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 16px 10px;
      border-radius: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-icon {
      margin-bottom: 8px;
      background: rgba(129, 140, 248, 0.14);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #818cf8;
      font-size: 1rem;
    }

    .result-card .value {
      display: block;
      font-size: 1.75rem;
      font-weight: 800;
      color: #818cf8;
      line-height: 1.1;
    }

    .result-card .label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* Bonus Grid Cards */
    .bonus-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .bonus-card {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 12px 14px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
    }

    .bonus-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .bonus-header i {
      color: #c084fc;
      font-size: 0.85rem;
    }

    .bonus-label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .bonus-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    /* Modal Backdrop & Calendar Popover */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 99;
    }

    .calendar-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 22px;
      width: 320px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .calendar-header {
      margin-bottom: 16px;
    }

    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calendar-nav button {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .calendar-nav button:hover {
      background: rgba(99, 102, 241, 0.4);
    }

    .calendar-title-group {
      display: flex;
      gap: 6px;
    }

    .calendar-title-group select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      outline: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .calendar-title-group select option {
      background: #0f172a;
      color: #fff;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-days button {
      aspect-ratio: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .calendar-days button:hover:not(:disabled):not(.empty) {
      background: rgba(99, 102, 241, 0.3);
      color: #ffffff;
    }

    .calendar-days button.selected {
      background: #6366f1 !important;
      color: #ffffff !important;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    }

    .calendar-days button.empty {
      visibility: hidden;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="brand">
      <span class="badge"><i class="fa-solid fa-sparkles"></i> Chronos Precise</span>
      <h1 class="app-title">Age Calculator</h1>
    </div>

    <!-- Date of Birth Input -->
    <div class="input-group">
      <div class="label-row">
        <label>Date of Birth</label>
      </div>
      <button type="button" class="custom-date-trigger" id="dobTrigger">
        <span id="dobText">Select Birth Date</span>
        <i class="fa-regular fa-calendar-days"></i>
      </button>
    </div>

    <!-- Target Date Input -->
    <div class="input-group">
      <div class="label-row">
        <label>Calculate Age At</label>
        <button type="button" class="today-btn" id="setTodayBtn">
          <i class="fa-solid fa-rotate-left"></i> Use Today
        </button>
      </div>
      <button type="button" class="custom-date-trigger" id="targetTrigger">
        <span id="targetText">Select Target Date</span>
        <i class="fa-regular fa-calendar-days"></i>
      </button>
    </div>

    <!-- Submit Button -->
    <button type="button" class="calc-btn" id="calcBtn">
      <i class="fa-solid fa-calculator"></i> Calculate Age
    </button>

    <!-- Error Display -->
    <div id="errorBox" class="error-msg hidden">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorText">Please select valid dates.</span>
    </div>

    <!-- Output Section -->
    <div id="resultsContainer" class="results-container hidden">
      <div class="date-summary" id="dateSummary">From -- to --</div>

      <!-- Main Age Cards -->
      <div class="results-grid">
        <div class="result-card">
          <div class="card-icon"><i class="fa-solid fa-hourglass-start"></i></div>
          <span class="value" id="yearsVal">0</span>
          <span class="label">Years</span>
        </div>
        <div class="result-card">
          <div class="card-icon"><i class="fa-solid fa-moon"></i></div>
          <span class="value" id="monthsVal">0</span>
          <span class="label">Months</span>
        </div>
        <div class="result-card">
          <div class="card-icon"><i class="fa-solid fa-sun"></i></div>
          <span class="value" id="daysVal">0</span>
          <span class="label">Days</span>
        </div>
      </div>

      <!-- Bonus Analytics Grid -->
      <div class="bonus-grid">
        <div class="bonus-card">
          <div class="bonus-header">
            <i class="fa-solid fa-star"></i>
            <span class="bonus-label">Zodiac Sign</span>
          </div>
          <div class="bonus-value" id="zodiacVal">--</div>
        </div>

        <div class="bonus-card">
          <div class="bonus-header">
            <i class="fa-solid fa-cake-candles"></i>
            <span class="bonus-label">Next Birthday</span>
          </div>
          <div class="bonus-value" id="nextBdayVal">-- days</div>
        </div>

        <div class="bonus-card">
          <div class="bonus-header">
            <i class="fa-solid fa-calendar-check"></i>
            <span class="bonus-label">Total Days</span>
          </div>
          <div class="bonus-value" id="totalDaysVal">--</div>
        </div>

        <div class="bonus-card">
          <div class="bonus-header">
            <i class="fa-solid fa-clock"></i>
            <span class="bonus-label">Total Hours</span>
          </div>
          <div class="bonus-value" id="totalHoursVal">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Interactive Calendar Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="calendarModal" class="calendar-modal hidden">
    <div class="calendar-header">
      <div class="calendar-nav">
        <button id="prevMonthBtn" type="button"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="calendar-title-group">
          <select id="monthSelect"></select>
          <select id="yearSelect"></select>
        </div>
        <button id="nextMonthBtn" type="button"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
    <div class="calendar-weekdays">
      <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
    </div>
    <div class="calendar-days" id="calendarDays"></div>
  </div>

  <script>
    // --- Application State ---
    let dobDate = null;
    let targetDate = new Date(); // Defaults to current day
    let activeField = null; // 'dob' or 'target'
    let viewDate = new Date();

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    // --- DOM Elements ---
    const dobTrigger = document.getElementById('dobTrigger');
    const dobText = document.getElementById('dobText');
    const targetTrigger = document.getElementById('targetTrigger');
    const targetText = document.getElementById('targetText');
    const setTodayBtn = document.getElementById('setTodayBtn');
    const calcBtn = document.getElementById('calcBtn');

    const modalBackdrop = document.getElementById('modalBackdrop');
    const calendarModal = document.getElementById('calendarModal');
    const monthSelect = document.getElementById('monthSelect');
    const yearSelect = document.getElementById('yearSelect');
    const calendarDays = document.getElementById('calendarDays');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');

    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const resultsContainer = document.getElementById('resultsContainer');
    const dateSummary = document.getElementById('dateSummary');

    const yearsVal = document.getElementById('yearsVal');
    const monthsVal = document.getElementById('monthsVal');
    const daysVal = document.getElementById('daysVal');
    const zodiacVal = document.getElementById('zodiacVal');
    const nextBdayVal = document.getElementById('nextBdayVal');
    const totalDaysVal = document.getElementById('totalDaysVal');
    const totalHoursVal = document.getElementById('totalHoursVal');

    // --- Format Helper Functions ---
    function formatDateDDMMYYYY(date) {
      if (!date) return '';
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}/${m}/${y}`;
    }

    // --- Calendar Dropdown Population ---
    function initDropdowns() {
      monthSelect.innerHTML = '';
      monthNames.forEach((name, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = name;
        monthSelect.appendChild(opt);
      });

      yearSelect.innerHTML = '';
      const currentYear = new Date().getFullYear();
      for (let y = currentYear + 50; y >= 1900; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }
    }

    // --- Calendar Rendering ---
    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      monthSelect.value = month;
      yearSelect.value = year;

      calendarDays.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Empty slots for alignment
      for (let i = 0; i < firstDay; i++) {
        const btn = document.createElement('button');
        btn.className = 'empty';
        calendarDays.appendChild(btn);
      }

      const activeDate = activeField === 'dob' ? dobDate : targetDate;

      // Days of the month
      for (let d = 1; d <= daysInMonth; d++) {
        const btn = document.createElement('button');
        btn.textContent = d;
        btn.type = 'button';

        if (
          activeDate &&
          activeDate.getFullYear() === year &&
          activeDate.getMonth() === month &&
          activeDate.getDate() === d
        ) {
          btn.classList.add('selected');
        }

        btn.addEventListener('click', () => {
          const selected = new Date(year, month, d);
          if (activeField === 'dob') {
            dobDate = selected;
            dobText.textContent = formatDateDDMMYYYY(dobDate);
          } else {
            targetDate = selected;
            targetText.textContent = formatDateDDMMYYYY(targetDate);
          }
          closeCalendar();
        });

        calendarDays.appendChild(btn);
      }
    }

    // --- Calendar Modal Controls ---
    function openCalendar(field) {
      activeField = field;
      const initialDate = (field === 'dob' ? dobDate : targetDate) || new Date();
      viewDate = new Date(initialDate.getTime());

      renderCalendar();
      modalBackdrop.classList.remove('hidden');
      calendarModal.classList.remove('hidden');
    }

    function closeCalendar() {
      modalBackdrop.classList.add('hidden');
      calendarModal.classList.add('hidden');
      activeField = null;
    }

    // Initialize UI default values
    targetText.textContent = formatDateDDMMYYYY(targetDate);
    initDropdowns();

    // Event Listeners for Custom Calendar
    dobTrigger.addEventListener('click', () => openCalendar('dob'));
    targetTrigger.addEventListener('click', () => openCalendar('target'));
    modalBackdrop.addEventListener('click', closeCalendar);

    setTodayBtn.addEventListener('click', () => {
      targetDate = new Date();
      targetText.textContent = formatDateDDMMYYYY(targetDate);
    });

    monthSelect.addEventListener('change', (e) => {
      viewDate.setMonth(parseInt(e.target.value));
      renderCalendar();
    });

    yearSelect.addEventListener('change', (e) => {
      viewDate.setFullYear(parseInt(e.target.value));
      renderCalendar();
    });

    prevMonthBtn.addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCalendar();
    });

    // --- Zodiac Calculation ---
    function getZodiacSign(day, month) {
      const dates = [20, 19, 21, 20, 21, 21, 23, 23, 23, 23, 22, 22];
      const signs = [
        "Capricorn", "Aquarius", "Pisces", "Aries", "Taurus", "Gemini",
        "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius"
      ];
      return day < dates[month - 1] ? signs[month - 1] : signs[month % 12];
    }

    // --- Age Calculation Logic ---
    function calculateAge() {
      errorBox.classList.add('hidden');

      if (!dobDate) {
        errorText.textContent = 'Please select a valid Date of Birth.';
        errorBox.classList.remove('hidden');
        resultsContainer.classList.add('hidden');
        return;
      }

      if (dobDate > targetDate) {
        errorText.textContent = 'Date of Birth cannot be after Target Date!';
        errorBox.classList.remove('hidden');
        resultsContainer.classList.add('hidden');
        return;
      }

      let y1 = dobDate.getFullYear();
      let m1 = dobDate.getMonth();
      let d1 = dobDate.getDate();

      let y2 = targetDate.getFullYear();
      let m2 = targetDate.getMonth();
      let d2 = targetDate.getDate();

      let years = y2 - y1;
      let months = m2 - m1;
      let days = d2 - d1;

      if (days < 0) {
        months--;
        const prevMonthLastDay = new Date(y2, m2, 0).getDate();
        days += prevMonthLastDay;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      // Display primary calculations
      yearsVal.textContent = years;
      monthsVal.textContent = months;
      daysVal.textContent = days;

      dateSummary.textContent = `From ${formatDateDDMMYYYY(dobDate)} to ${formatDateDDMMYYYY(targetDate)}`;

      // Calculate Total Time Stats
      const diffTime = Math.abs(targetDate - dobDate);
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const totalHours = totalDays * 24;

      totalDaysVal.textContent = totalDays.toLocaleString();
      totalHoursVal.textContent = totalHours.toLocaleString();

      // Zodiac
      zodiacVal.textContent = getZodiacSign(dobDate.getDate(), dobDate.getMonth() + 1);

      // Next Birthday Countdown
      let nextBday = new Date(targetDate.getFullYear(), dobDate.getMonth(), dobDate.getDate());
      if (nextBday < targetDate) {
        nextBday.setFullYear(targetDate.getFullYear() + 1);
      }
      const daysToNextBday = Math.ceil((nextBday - targetDate) / (1000 * 60 * 60 * 24));
      nextBdayVal.textContent = `${daysToNextBday} ${daysToNextBday === 1 ? 'day' : 'days'}`;

      resultsContainer.classList.remove('hidden');
    }

    calcBtn.addEventListener('click', calculateAge);

    // --- Embedded PWA Capabilities ---
    const manifestObj = {
      name: "Chronos Modern Age Calculator",
      short_name: "AgeCalc",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#6366f1",
      icons: [{
        src: "https://placehold.co/192x192/6366f1/ffffff?text=Age",
        sizes: "192x192",
        type: "image/png"
      }]
    };

    const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW setup standard fallback', err));
      });
    }
  </script>
</body>
